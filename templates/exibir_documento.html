<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Documento: {{ documento.categoria }}/{{ documento.id }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
<body>
    <div class = "container">
        <div class = "item">
            <button id = "botao-voltar" onclick = "window.history.back()"> 
                <img src="{{ url_for('static', filename='voltar.png') }}" alt="Voltar">
            </button>
        </div>
    </div>

    <div class="central">
        <h1>{{ documento.categoria | capitalize }}/{{ documento.id }}</h1> 
        <div class="acoes-artigo">
            {% if artigo_salvo %}
                <form method="POST" action="{{ url_for('remover_artigo') }}">
                    <input type="hidden" name="categoria" value="{{ documento.categoria }}">
                    <input type="hidden" name="doc_id" value="{{ documento.id }}">
                    <input type="hidden" name="next" value="{{ request.url }}">
                    <button type="submit" class="botao-remover-salvo">Remover dos salvos</button>
                </form>
            {% else %}
                <form method="POST" action="{{ url_for('salvar_artigo') }}">
                    <input type="hidden" name="categoria" value="{{ documento.categoria }}">
                    <input type="hidden" name="doc_id" value="{{ documento.id }}">
                    <input type="hidden" name="next" value="{{ request.url }}">
                    <button type="submit" id="botao-salvar-artigo">Salvar artigo</button>
                </form>
            {% endif %}
        </div>
        <hr>

        <div class="conteudo-documento">
            {{ documento.conteudo }}
        </div>
    </div>
</body>
</html>
