<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Página inicial</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class = "container">
        <div class = "item">
            <a href = "{{ url_for('perfil') }}">
                <button id = "perfil">
                    <img src="{{ url_for('static', filename='perfil.png') }}" alt="perfil">
                </button>
            </a>
        </div>

        <div class="item">
            <a href="{{ url_for('artigos_salvos') }}">
                <button id="salvos" aria-label="Artigos salvos" title="Artigos salvos">★</button>
            </a>
        </div>


        <div class = "item">
            <a href = "{{ url_for('historico') }}">
                <button id = "historico">
                    <img src="{{ url_for('static', filename='historico.png') }}" alt="Histórico">
                </button>
            </a>
        </div>

        <div class = "item">
            <a href = "{{ url_for('ajuda') }}">
                <button id = "ajuda"> 
                    <img src="{{ url_for('static', filename='ajuda.png') }}" alt="Ajuda">
                </button>
            </a>
        </div>

        <div class = "item">
            <form method="POST" action="{{ url_for('logout') }}">
                <button type="submit" id="logout">
                    <img src="{{ url_for('static', filename='logout.png') }}" alt="Logout">
                </button>
            </form>
        </div>
    </div>

    <div class="central">
        <h1> Máquina de Busca </h1>

        <p> Realize consultas sobre o bando de dados de
            <a href = "http://derekgreene.com/bbc/" target="_blank"> Greene e Cunningham (2006)</a>.
        </p>
        <p> Você pode realizar consultas de AND, OR e NOT sobre qualquer termo. </p>

        <form method="POST" action="{{ url_for('search_results') }}">
            <input type = "text" id = "mensagem" name = "mensagem" placeholder = "Insira sua busca aqui..." required>
            <button type = "submit" id = "botao-busca"> Buscar </button>
        </form>

    </div>
</body>

</html>
