<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Perfil</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    {% include '_navegacao.html' %}

    <main class="central auth-central">
        <h1>Meu perfil</h1>

        <section class="auth-panel" aria-label="Editar perfil">
            {% with mensagens = get_flashed_messages(with_categories=true) %}
                {% for categoria, mensagem in mensagens %}
                    <p class="auth-mensagem {{ categoria }}" role="status">{{ mensagem }}</p>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('perfil') }}" class="auth-form">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" value="{{ perfil['nome'] }}" autocomplete="name" required>

                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" name="usuario" value="{{ perfil['usuario'] }}" autocomplete="username" required>

                <label for="senha">Nova senha</label>
                <input type="password" id="senha" name="senha" autocomplete="new-password" minlength="6" placeholder="Deixe em branco para manter">

                <label for="confirmar_senha">Confirmar nova senha</label>
                <input type="password" id="confirmar_senha" name="confirmar_senha" autocomplete="new-password" minlength="6">

                <button type="submit" id="botao-busca">Salvar alterações</button>
            </form>

            <form
                method="POST"
                action="{{ url_for('deletar_perfil') }}"
                class="perfil-excluir"
                onsubmit="return confirm('Tem certeza que deseja excluir sua conta? Esta ação não pode ser desfeita.')"
            >
                <button type="submit" class="botao-excluir">Excluir conta</button>
            </form>

        </section>
    </main>
</body>

</html>
